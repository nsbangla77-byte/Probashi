<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>সংগঠনের হিসাব</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      width: 95%;
      max-width: 1100px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1, h2 {
      margin-top: 0;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 15px;
    }

    button {
      cursor: pointer;
      border: none;
      background: #0b7a43;
      color: white;
      font-weight: bold;
    }

    button:hover {
      opacity: .9;
    }

    .logout {
      background: #c62828;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .stat {
      text-align: center;
      padding: 20px;
      border-radius: 12px;
      background: #eef8f2;
    }

    .stat strong {
      display: block;
      font-size: 28px;
      margin-top: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    .deposit {
      color: green;
      font-weight: bold;
    }

    .withdraw {
      color: red;
      font-weight: bold;
    }

    .hidden {
      display: none;
    }

    @media(max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      table {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- Login -->
  <div id="loginBox" class="card">

    <h1>🔐 Admin Login</h1>

    <input
      id="username"
      placeholder="Username"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button onclick="login()">
      Login
    </button>

    <p id="loginMessage"></p>

  </div>


  <!-- Dashboard -->
  <div id="dashboard" class="hidden">

    <div class="card">

      <h1>
        📊 সংগঠনের হিসাব ব্যবস্থাপনা
      </h1>

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </div>


    <!-- Statistics -->

    <div class="grid">

      <div class="stat">
        বর্তমান ব্যালেন্স
        <strong id="balance">
          ৳0
        </strong>
      </div>

      <div class="stat">
        মোট জমা
        <strong id="totalDeposit">
          ৳0
        </strong>
      </div>

      <div class="stat">
        মোট উত্তোলন
        <strong id="totalWithdraw">
          ৳0
        </strong>
      </div>

    </div>


    <!-- Add transaction -->

    <div class="card">

      <h2>
        ➕ নতুন হিসাব যোগ করুন
      </h2>

      <select id="type">

        <option value="deposit">
          টাকা জমা
        </option>

        <option value="withdraw">
          টাকা উত্তোলন
        </option>

      </select>

      <input
        id="member"
        placeholder="সদস্য/ব্যক্তির নাম"
      >

      <input
        id="amount"
        type="number"
        placeholder="টাকার পরিমাণ"
      >

      <input
        id="note"
        placeholder="বিবরণ"
      >

      <button onclick="addTransaction()">
        হিসাব সংরক্ষণ করুন
      </button>

      <p id="message"></p>

    </div>


    <!-- Transactions -->

    <div class="card">

      <h2>
        📜 লেনদেনের ইতিহাস
      </h2>

      <table>

        <thead>

          <tr>
            <th>তারিখ</th>
            <th>ধরন</th>
            <th>নাম</th>
            <th>পরিমাণ</th>
            <th>বিবরণ</th>
            <th>Action</th>
          </tr>

        </thead>

        <tbody id="transactionList"></tbody>

      </table>

    </div>

  </div>

</div>


<script>

async function login() {

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  const response = await fetch(
    "/api/login",
    {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        username,
        password
      })
    }
  );

  const data = await response.json();

  if (data.success) {

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("dashboard")
      .classList.remove("hidden");

    loadData();

  } else {

    document
      .getElementById("loginMessage")
      .innerText =
      data.message;

  }

}


async function logout() {

  await fetch(
    "/api/logout",
    {
      method: "POST"
    }
  );

  location.reload();

}


async function loadData() {

  const balanceResponse =
    await fetch("/api/balance");

  const balanceData =
    await balanceResponse.json();

  document.getElementById(
    "balance"
  ).innerText =
    "৳" +
    Number(balanceData.balance)
      .toLocaleString("bn-BD");


  const response =
    await fetch("/api/transactions");

  const transactions =
    await response.json();

  let deposit = 0;
  let withdraw = 0;

  const list =
    document.getElementById(
      "transactionList"
    );

  list.innerHTML = "";

  transactions.forEach(item => {

    if (item.type === "deposit") {
      deposit += Number(item.amount);
    } else {
      withdraw += Number(item.amount);
    }

    const tr =
      document.createElement("tr");

    tr.innerHTML = `

      <td>
        ${item.created_at}
      </td>

      <td class="${
        item.type === "deposit"
          ? "deposit"
          : "withdraw"
      }">

        ${
          item.type === "deposit"
            ? "জমা"
            : "উত্তোলন"
        }

      </td>

      <td>
        ${escapeHtml(item.member)}
      </td>

      <td>
        ৳${Number(item.amount)
          .toLocaleString("bn-BD")}
      </td>

      <td>
        ${escapeHtml(item.note || "")}
      </td>

      <td>

        <button
          onclick="editTransaction(${item.id})"
        >
          Edit
        </button>

        <button
          onclick="deleteTransaction(${item.id})"
          style="background:#c62828"
        >
          Delete
        </button>

      </td>

    `;

    list.appendChild(tr);

  });


  document.getElementById(
    "totalDeposit"
  ).innerText =
    "৳" +
    deposit.toLocaleString("bn-BD");


  document.getElementById(
    "totalWithdraw"
  ).innerText =
    "৳" +
    withdraw.toLocaleString("bn-BD");

}


async function addTransaction() {

  const type =
    document.getElementById("type").value;

  const member =
    document.getElementById("member").value;

  const amount =
    document.getElementById("amount").value;

  const note =
    document.getElementById("note").value;


  const response =
    await fetch(
      "/api/transactions",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          type,
          member,
          amount,
          note
        })
      }
    );


  const data =
    await response.json();


  if (!response.ok) {

    document.getElementById(
      "message"
    ).innerText =
      data.message;

    return;
  }


  document.getElementById(
    "message"
  ).innerText =
    "হিসাব সফলভাবে সংরক্ষণ হয়েছে।";


  document.getElementById(
    "member"
  ).value = "";

  document.getElementById(
    "amount"
  ).value = "";

  document.getElementById(
    "note"
  ).value = "";


  loadData();

}


async function editTransaction(id) {

  const member =
    prompt(
      "নতুন নাম লিখুন:"
    );

  if (!member) return;


  const amount =
    prompt(
      "নতুন পরিমাণ লিখুন:"
    );

  if (!amount) return;


  const note =
    prompt(
      "নতুন বিবরণ লিখুন:"
    );


  const transactions =
    await fetch(
      "/api/transactions"
    );

  const data =
    await transactions.json();

  const old =
    data.find(x => x.id === id);


  await fetch(
    `/api/transactions/${id}`,
    {
      method: "PUT",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        type: old.type,
        member,
        amount,
        note
      })
    }
  );


  loadData();

}


async function deleteTransaction(id) {

  if (
    !confirm(
      "এই হিসাবটি মুছে ফেলতে চান?"
    )
  ) {
    return;
  }


  await fetch(
    `/api/transactions/${id}`,
    {
      method: "DELETE"
    }
  );


  loadData();

}

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
